name: Python CI and regression checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify installed dependency graph
        run: python -m pip check
      - name: Validate Python compilation
        run: python -m compileall -q agents radiogenomics_sentinel cli.py enrichment.py simulator.py
      - name: Run regression suite (including browser JavaScript check)
        run: python -m pytest -q
