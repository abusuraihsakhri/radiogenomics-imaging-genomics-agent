[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "radiogenomics-imaging-genomics-engine"
version = "2.0.0"
description = "RadioGenomics Sentinel: PyRadiomics Feature & Somatic Mutation Association Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2,<3",
    "fastapi>=0.110,<1",
    "uvicorn>=0.24,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
radiogenomics-imaging-genomics-engine = "radiogenomics_sentinel.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/radiogenomics-imaging-genomics-agent"
Repository = "https://github.com/abusuraihsakhri/radiogenomics-imaging-genomics-engine.git"
